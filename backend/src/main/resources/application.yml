spring:
  application:
    name: career-compass-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/career_compass?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
server:
  error:
    include-message: always
app:
  jwt-secret: ${APP_JWT_SECRET:careercompass-default-secret-key-must-be-at-least-32-bytes!}
  demo-data:
    enabled: ${APP_DEMO_DATA:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://career-compass-ai-peach-theta.vercel.app,https://career-compass-ahg3w7rcv-coders-85c1.vercel.app}